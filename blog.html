<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnChain Blog - Universal State Machine</title>
    <script src="https://cdn.jsdelivr.net/npm/algosdk@2.7.0/dist/browser/algosdk.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .wallet-section {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .wallet-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .wallet-input-container {
            position: relative;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            transition: border 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .toggle-visibility {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(102, 126, 234, 0.1);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: #667eea;
            transition: background 0.3s;
        }

        .toggle-visibility:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .connected-info {
            background: #f0f9ff;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .connected-info strong {
            color: #667eea;
        }

        .address {
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            color: #666;
            margin-top: 5px;
        }

        .editor-section {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: none;
        }

        .editor-section.active {
            display: block;
        }

        .editor-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .editor {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
        }

        .editor:focus {
            outline: none;
            border-color: #667eea;
        }

        .posts-section {
            display: none;
        }

        .posts-section.active {
            display: block;
        }

        .post-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            transition: transform 0.3s;
        }

        .post-card:hover {
            transform: translateY(-5px);
        }

        .post-header {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .post-title {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .post-meta {
            font-size: 13px;
            color: #999;
        }

        .post-author {
            color: #667eea;
            font-weight: 600;
        }

        .post-content {
            color: #333;
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .post-actions {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            background: white;
            padding: 60px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .empty-state h3 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #999;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status-message.success {
            background: #d1fae5;
            border-left: 4px solid #10b981;
            color: #065f46;
            display: block;
        }

        .status-message.error {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
            display: block;
        }

        .char-count {
            text-align: right;
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>⛓️ OnChain Blog</h1>
            <p>Fully decentralized blog powered by Universal State Machine on Algorand TestNet</p>
            <p style="margin-top: 10px; font-size: 12px;">
                <strong>Smart Contract:</strong>
                <a href="https://lora.algokit.io/testnet/application/749599252" target="_blank" style="color: #667eea;">749599252</a>
            </p>
        </div>

        <!-- Wallet Connection -->
        <div class="wallet-section">
            <h2>🔗 Connect Wallet</h2>
            <div id="walletInputSection">
                <div class="wallet-input-container">
                    <textarea
                        id="mnemonicInput"
                        rows="3"
                        placeholder="Enter your 25-word Algorand mnemonic phrase..."
                        style="-webkit-text-security: disc;"
                    ></textarea>
                    <button class="toggle-visibility" onclick="toggleMnemonicVisibility()">👁️ Show</button>
                </div>
                <button class="btn btn-primary" onclick="connectWallet()">Connect Wallet</button>
            </div>
            <div id="walletConnected" style="display: none;">
                <div class="connected-info">
                    <strong>✅ Connected</strong>
                    <div class="address" id="connectedAddress"></div>
                    <div style="margin-top: 10px; font-size: 13px;">
                        Balance: <strong id="algoBalance">0</strong> ALGO
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <button class="btn btn-primary" onclick="showEditor()">✍️ Write New Post</button>
                    <button class="btn btn-success" onclick="loadAllPosts()">📚 View All Posts</button>
                    <button class="btn btn-danger" onclick="disconnectWallet()">Disconnect</button>
                </div>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="statusMessage" class="status-message"></div>

        <!-- Post Editor -->
        <div class="editor-section" id="editorSection">
            <h2>✍️ Write New Post</h2>
            <div class="form-group">
                <label>Post Title</label>
                <input type="text" id="postTitle" placeholder="Enter an engaging title..." maxlength="200">
            </div>
            <div class="form-group">
                <label>Post Content</label>
                <textarea class="editor" id="postContent" placeholder="Write your thoughts here..."></textarea>
                <div class="char-count">
                    <span id="contentLength">0</span> / 3500 characters
                </div>
            </div>
            <button class="btn btn-primary" onclick="publishPost()">📤 Publish to Blockchain</button>
            <button class="btn" style="background: #e5e7eb; color: #333;" onclick="cancelEditor()">Cancel</button>
        </div>

        <!-- Posts Display -->
        <div class="posts-section" id="postsSection">
            <div id="postsContainer"></div>
        </div>
    </div>

    <script>
        // Configuration
        const APP_ID = 749599252;
        const ALGOD_SERVER = 'https://testnet-api.algonode.cloud';
        const ALGOD_PORT = '';
        const ALGOD_TOKEN = '';

        // Global state
        let algodClient;
        let currentAccount = null;

        // Full ABI Contract Definition (from compiled ARC-56)
        const CONTRACT_ABI = {
            "name": "UniversalStateMachine",
            "methods": [
                {"name": "save_entity", "args": [{"type": "string", "name": "entity_id"}, {"type": "string", "name": "entity_data"}, {"type": "pay", "name": "mbr_payment"}], "returns": {"type": "string"}},
                {"name": "load_entity", "args": [{"type": "string", "name": "entity_id"}], "returns": {"type": "string"}},
                {"name": "get_entity_owner", "args": [{"type": "string", "name": "entity_id"}], "returns": {"type": "address"}},
                {"name": "transfer_entity", "args": [{"type": "string", "name": "entity_id"}, {"type": "address", "name": "new_owner"}], "returns": {"type": "string"}},
                {"name": "delete_entity", "args": [{"type": "string", "name": "entity_id"}], "returns": {"type": "string"}},
                {"name": "start_process", "args": [{"type": "string", "name": "process_id"}, {"type": "address", "name": "other_party"}, {"type": "string", "name": "initial_state"}, {"type": "pay", "name": "mbr_payment"}], "returns": {"type": "string"}},
                {"name": "update_process", "args": [{"type": "string", "name": "process_id"}, {"type": "string", "name": "new_state"}, {"type": "pay", "name": "mbr_payment"}], "returns": {"type": "string"}},
                {"name": "load_process", "args": [{"type": "string", "name": "process_id"}], "returns": {"type": "string"}},
                {"name": "delete_process", "args": [{"type": "string", "name": "process_id"}], "returns": {"type": "string"}},
                {"name": "get_process_info", "args": [{"type": "string", "name": "process_id"}], "returns": {"type": "(address,address,uint64)"}},
                {"name": "pause", "args": [], "returns": {"type": "string"}},
                {"name": "unpause", "args": [], "returns": {"type": "string"}},
                {"name": "set_admin", "args": [{"type": "address", "name": "new_admin"}], "returns": {"type": "string"}},
                {"name": "withdraw_excess", "args": [{"type": "uint64", "name": "amount"}], "returns": {"type": "string"}},
                {"name": "get_admin", "args": [], "returns": {"type": "address"}},
                {"name": "is_paused", "args": [], "returns": {"type": "bool"}}
            ]
        };

        // Helper: Create box key with ARC-4 encoding (matches blockchain.js implementation)
        function createBlogBoxKey(postId) {
            const encoder = new TextEncoder();
            const idBytes = encoder.encode(postId);
            const idLength = idBytes.length;

            // ARC-4 string encoding: 2-byte big-endian length prefix + string bytes
            const arc4Encoded = new Uint8Array(2 + idLength);
            arc4Encoded[0] = (idLength >> 8) & 0xFF;  // High byte
            arc4Encoded[1] = idLength & 0xFF;          // Low byte
            arc4Encoded.set(idBytes, 2);

            // Full box key: "e:" + arc4_encoded_post_id
            const boxKey = new Uint8Array(2 + arc4Encoded.length);
            boxKey.set(encoder.encode('e:'), 0);
            boxKey.set(arc4Encoded, 2);

            return boxKey;
        }

        // Initialize Algorand client
        function initAlgod() {
            algodClient = new algosdk.Algodv2(ALGOD_TOKEN, ALGOD_SERVER, ALGOD_PORT);
        }

        // Toggle mnemonic visibility
        function toggleMnemonicVisibility() {
            const input = document.getElementById('mnemonicInput');
            const btn = event.target;
            if (input.style.webkitTextSecurity === 'disc') {
                input.style.webkitTextSecurity = 'none';
                btn.textContent = '🙈 Hide';
            } else {
                input.style.webkitTextSecurity = 'disc';
                btn.textContent = '👁️ Show';
            }
        }

        // Connect wallet
        async function connectWallet() {
            try {
                const mnemonic = document.getElementById('mnemonicInput').value.trim();
                if (!mnemonic) {
                    showStatus('Please enter your mnemonic phrase', 'error');
                    return;
                }

                initAlgod();
                currentAccount = algosdk.mnemonicToSecretKey(mnemonic);

                // Get balance
                const accountInfo = await algodClient.accountInformation(currentAccount.addr).do();
                const balance = (accountInfo.amount / 1000000).toFixed(2);

                // Update UI
                document.getElementById('walletInputSection').style.display = 'none';
                document.getElementById('walletConnected').style.display = 'block';
                document.getElementById('connectedAddress').textContent = currentAccount.addr;
                document.getElementById('algoBalance').textContent = balance;

                showStatus('✅ Wallet connected successfully!', 'success');
            } catch (error) {
                console.error('Connection error:', error);
                showStatus('Failed to connect wallet. Please check your mnemonic.', 'error');
            }
        }

        // Disconnect wallet
        function disconnectWallet() {
            currentAccount = null;
            document.getElementById('walletInputSection').style.display = 'block';
            document.getElementById('walletConnected').style.display = 'none';
            document.getElementById('mnemonicInput').value = '';
            document.getElementById('editorSection').classList.remove('active');
            document.getElementById('postsSection').classList.remove('active');
            showStatus('Disconnected from wallet', 'success');
        }

        // Show editor
        function showEditor() {
            document.getElementById('editorSection').classList.add('active');
            document.getElementById('postsSection').classList.remove('active');
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
        }

        // Cancel editor
        function cancelEditor() {
            document.getElementById('editorSection').classList.remove('active');
        }

        // Update character count
        document.addEventListener('DOMContentLoaded', () => {
            const contentArea = document.getElementById('postContent');
            if (contentArea) {
                contentArea.addEventListener('input', () => {
                    const length = contentArea.value.length;
                    document.getElementById('contentLength').textContent = length;
                    if (length > 3500) {
                        contentArea.value = contentArea.value.substring(0, 3500);
                        document.getElementById('contentLength').textContent = '3500';
                    }
                });
            }
        });

        // Publish post to blockchain
        async function publishPost() {
            if (!currentAccount) {
                showStatus('Please connect your wallet first', 'error');
                return;
            }

            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!title || !content) {
                showStatus('Please fill in both title and content', 'error');
                return;
            }

            try {
                showStatus('📤 Publishing to blockchain...', 'success');

                // Create post data
                const postData = {
                    title: title,
                    content: content,
                    author: currentAccount.addr,
                    timestamp: Date.now()
                };

                // Generate unique post ID (must be <= 62 chars due to contract limit)
                const addr = currentAccount.addr;
                const shortAddr = addr.slice(0, 8) + addr.slice(-8);
                const postId = `blog-${Date.now()}-${shortAddr}`;

                // Prepare transaction
                const params = await algodClient.getTransactionParams().do();
                const encoder = new TextEncoder();
                const entityIdBytes = encoder.encode(postId);
                const entityDataBytes = encoder.encode(JSON.stringify(postData));

                // Calculate MBR (including ARC-4 encoding overhead)
                // Both entity_id and entity_data are ARC-4 encoded (each adds 2-byte length prefix)
                const keyLen = entityIdBytes.length + 2; // +2 for ARC-4 length prefix
                const dataLen = entityDataBytes.length + 2; // +2 for ARC-4 length prefix
                const totalBytes = 2 + keyLen + 32 + dataLen;
                const mbrAmount = 2500 + (400 * totalBytes);

                // Create atomic transaction composer
                const atc = new algosdk.AtomicTransactionComposer();

                // Add MBR payment
                const mbrTxn = algosdk.makePaymentTxnWithSuggestedParamsFromObject({
                    from: currentAccount.addr,
                    to: algosdk.getApplicationAddress(APP_ID),
                    amount: mbrAmount,
                    suggestedParams: params
                });

                // Use full ABI contract
                const contract = new algosdk.ABIContract(CONTRACT_ABI);
                const method = contract.getMethodByName('save_entity');

                // Box reference with ARC-4 encoding
                const boxKey = createBlogBoxKey(postId);

                atc.addMethodCall({
                    appID: APP_ID,
                    method: method,
                    methodArgs: [postId, JSON.stringify(postData), { txn: mbrTxn, signer: algosdk.makeBasicAccountTransactionSigner(currentAccount) }],
                    sender: currentAccount.addr,
                    suggestedParams: params,
                    signer: algosdk.makeBasicAccountTransactionSigner(currentAccount),
                    boxes: [{appIndex: APP_ID, name: boxKey}]
                });

                // Execute
                const result = await atc.execute(algodClient, 3);
                console.log('Transaction result:', result);

                showStatus('✅ Post published successfully to blockchain!', 'success');

                // Clear editor
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                document.getElementById('editorSection').classList.remove('active');

                // Reload posts
                setTimeout(() => loadAllPosts(), 2000);

            } catch (error) {
                console.error('Publish error:', error);
                showStatus(`Failed to publish: ${error.message}`, 'error');
            }
        }

        // Load all posts from blockchain
        async function loadAllPosts() {
            if (!currentAccount) {
                showStatus('Please connect your wallet first', 'error');
                return;
            }

            try {
                showStatus('📚 Loading posts from blockchain...', 'success');

                document.getElementById('editorSection').classList.remove('active');
                document.getElementById('postsSection').classList.add('active');

                const container = document.getElementById('postsContainer');
                container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading posts from blockchain...</p></div>';

                // Get all boxes
                const boxes = await algodClient.getApplicationBoxes(APP_ID).do();
                console.log('All boxes:', boxes);

                const blogPosts = [];
                const decoder = new TextDecoder();

                for (const box of boxes.boxes) {
                    // Decode box name from ARC-4 encoding
                    const rawName = box.name;

                    // Check if it starts with "e:" (first 2 bytes)
                    if (rawName[0] === 0x65 && rawName[1] === 0x3a) {
                        // Extract ARC-4 encoded string after "e:"
                        const arc4Data = rawName.slice(2);
                        if (arc4Data.length >= 2) {
                            const strLength = (arc4Data[0] << 8) | arc4Data[1];
                            const strBytes = arc4Data.slice(2, 2 + strLength);
                            const entityId = decoder.decode(strBytes);

                            // Check if it's a blog post
                            if (entityId.startsWith('blog-')) {
                                try {
                                    const boxData = await algodClient.getApplicationBoxByName(APP_ID, rawName).do();
                                    const boxValue = boxData.value;

                                    // Box structure: owner(32) + ARC-4 encoded data
                                    // Skip owner (first 32 bytes)
                                    const dataStart = 32;

                                    // Decode ARC-4 string: 2-byte length prefix + string bytes
                                    const dataLength = (boxValue[dataStart] << 8) | boxValue[dataStart + 1];
                                    const dataBytes = boxValue.slice(dataStart + 2, dataStart + 2 + dataLength);

                                    // Parse JSON
                                    const jsonData = decoder.decode(dataBytes);
                                    const post = JSON.parse(jsonData);
                                    post.id = `e:${entityId}`;
                                    post.entityId = entityId;
                                    blogPosts.push(post);
                                } catch (error) {
                                    console.error('Error loading box:', entityId, error);
                                }
                            }
                        }
                    }
                }

                // Sort by timestamp (newest first)
                blogPosts.sort((a, b) => b.timestamp - a.timestamp);

                // Display posts
                if (blogPosts.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>No posts yet</h3>
                            <p>Be the first to write a post on the blockchain!</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = blogPosts.map(post => createPostCard(post)).join('');
                }

                showStatus(`✅ Loaded ${blogPosts.length} post(s) from blockchain`, 'success');

            } catch (error) {
                console.error('Load error:', error);
                showStatus(`Failed to load posts: ${error.message}`, 'error');
                document.getElementById('postsContainer').innerHTML = `
                    <div class="empty-state">
                        <h3>Error loading posts</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Create post card HTML
        function createPostCard(post) {
            const date = new Date(post.timestamp);
            const isOwner = currentAccount && post.author === currentAccount.addr;

            return `
                <div class="post-card">
                    <div class="post-header">
                        <h2 class="post-title">${escapeHtml(post.title)}</h2>
                        <div class="post-meta">
                            <span class="post-author">By: ${post.author.substring(0, 10)}...${post.author.substring(post.author.length - 8)}</span>
                            <span style="margin: 0 10px;">•</span>
                            <span>${date.toLocaleDateString()} ${date.toLocaleTimeString()}</span>
                        </div>
                    </div>
                    <div class="post-content">${escapeHtml(post.content)}</div>
                    ${isOwner ? `
                        <div class="post-actions">
                            <button class="btn btn-danger" onclick="deletePost('${post.entityId}')">🗑️ Delete Post</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Delete post
        async function deletePost(entityId) {
            if (!confirm('Are you sure you want to delete this post from the blockchain?')) {
                return;
            }

            try {
                showStatus('🗑️ Deleting post...', 'success');

                const params = await algodClient.getTransactionParams().do();

                // Use full ABI contract
                const contract = new algosdk.ABIContract(CONTRACT_ABI);
                const method = contract.getMethodByName('delete_entity');
                const atc = new algosdk.AtomicTransactionComposer();

                // Box reference with ARC-4 encoding
                const boxKey = createBlogBoxKey(entityId);

                atc.addMethodCall({
                    appID: APP_ID,
                    method: method,
                    methodArgs: [entityId],
                    sender: currentAccount.addr,
                    suggestedParams: params,
                    signer: algosdk.makeBasicAccountTransactionSigner(currentAccount),
                    boxes: [{appIndex: APP_ID, name: boxKey}]
                });

                await atc.execute(algodClient, 3);

                showStatus('✅ Post deleted successfully!', 'success');

                // Reload posts
                setTimeout(() => loadAllPosts(), 2000);

            } catch (error) {
                console.error('Delete error:', error);
                showStatus(`Failed to delete: ${error.message}`, 'error');
            }
        }

        // Show status message
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;

            if (type === 'success') {
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 5000);
            }
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        initAlgod();
    </script>
</body>
</html>
