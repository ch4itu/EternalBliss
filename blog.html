<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnChain Blog | Retro World</title>
    
    <!-- Preconnect to critical origins FIRST -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://esm.sh" crossorigin>
    
    <!-- Preload critical resources -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" as="style">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/algosdk@2.7.0/dist/browser/algosdk.min.js" as="script">
    
    <!-- Load fonts with display=swap (non-blocking) -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/algosdk@2.7.0/dist/browser/algosdk.min.js"></script>
    
    <!-- Critical CSS inlined -->
    <style>
        :root {
            --sky: #5c94fc;
            --brick-bg: #b53121;
            --brick-border: #000000;
            --brick-highlight: #e54b38;
            --pipe-green: #00a800;
            --pipe-dark: #006800;
            --pipe-light: #32d832;
            --coin-gold: #fca044;
            --coin-glow: #ffe1a8;
            --ground: #e75910;
            --ground-pattern: rgba(0,0,0,0.1);
            --text-main: #ffffff;
            --font-pixel: 'Press Start 2P', monospace;
            --font-body: 'Silkscreen', sans-serif;
        }

        [data-theme="dark"] {
            --sky: #050510;
            --brick-bg: #2a1a1a;
            --brick-highlight: #4a2a2a;
            --ground: #1a1005;
            --ground-pattern: rgba(0,0,0,0.3);
        }

        * { 
            box-sizing: border-box; 
            image-rendering: pixelated;
            margin: 0;
            padding: 0;
        }
        
        /* Only apply transitions to elements that need them */
        body, .card, .ground-base {
            transition: background-color 0.4s steps(4), border-color 0.4s steps(4);
        }

        body {
            background-color: var(--sky);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Scanlines - use will-change for GPU acceleration */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
            z-index: 1000;
            background-size: 100% 4px;
            pointer-events: none;
            will-change: transform;
        }

        .container { 
            width: 100%;
            max-width: 800px; 
            margin: 0 auto; 
            padding: 2rem 1rem 100px 1rem; 
            position: relative;
        }

        .stats-hud {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-pixel);
            font-size: clamp(8px, 2vw, 12px);
            margin-bottom: 3rem;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000;
        }

        .header { margin-bottom: 3rem; text-align: center; }
        .header h1 {
            font-family: var(--font-pixel);
            font-size: clamp(1rem, 7vw, 2.5rem);
            margin: 0 0 1rem 0;
            text-shadow: 6px 6px 0px #000;
            animation: bounce 0.6s infinite alternate;
        }
        
        @keyframes bounce { 
            from { transform: translateY(0); } 
            to { transform: translateY(-5px); } 
        }

        .card {
            background-color: var(--brick-bg);
            border: 4px solid var(--brick-border);
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.4),
                inset 4px 4px 0px var(--brick-highlight),
                8px 8px 0px rgba(0,0,0,0.5);
            position: relative;
        }

        .card-special {
            background-color: var(--coin-gold);
            border: 4px solid #000;
            box-shadow: 
                inset -4px -4px 0px #a46000,
                inset 4px 4px 0px var(--coin-glow),
                8px 8px 0px rgba(0,0,0,0.5);
        }
        .card-special h2 { color: #000; text-shadow: none; }

        h2 { 
            font-family: var(--font-pixel);
            font-size: clamp(12px, 3.5vw, 16px);
            margin-bottom: 1.5rem;
            text-shadow: 3px 3px 0px #000;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 18px;
            background: var(--pipe-green);
            border: 4px solid #000;
            color: #fff;
            font-family: var(--font-pixel);
            font-size: 10px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 
                inset -4px -4px 0px var(--pipe-dark),
                inset 4px 4px 0px var(--pipe-light);
            margin: 0 8px 12px 0;
            width: 100%;
        }

        @media (min-width: 600px) {
            .btn { width: auto; }
        }

        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-coin { 
            background: #fff; 
            color: #000; 
            box-shadow: inset -4px -4px 0px #ccc, inset 4px 4px 0px #fff; 
        }
        
        .btn-danger {
            background: #c00;
            box-shadow: inset -4px -4px 0px #800, inset 4px 4px 0px #f44;
        }

        input[type="text"], textarea {
            width: 100%;
            background: #fff;
            border: 4px solid #000;
            padding: 12px;
            color: #000;
            font-family: var(--font-body);
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
        }

        .post-card { background: #fff; color: #000; border-left: 12px solid var(--pipe-green); }
        .post-card h2 { color: #000; text-shadow: none; }
        .post-meta { font-family: var(--font-pixel); font-size: 8px; color: #666; margin-bottom: 1.2rem; }
        .post-content { border-top: 2px solid #ddd; padding-top: 1rem; font-size: 1.1rem; white-space: pre-wrap; }
        .post-actions { margin-top: 1rem; padding-top: 1rem; border-top: 2px solid #ddd; }
        .post-modified { font-size: 10px; color: #c60; margin-top: 0.5rem; }

        .ground-base {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 60px;
            background: var(--ground);
            border-top: 4px solid #000;
            z-index: 10;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, var(--ground-pattern) 10px, var(--ground-pattern) 20px);
        }

        @media (max-width: 480px) {
            .stats-hud { flex-direction: column; gap: 8px; text-align: center; }
            .container { padding-bottom: 120px; }
        }

        .status-toast {
            position: fixed;
            top: 2rem; left: 50%; transform: translateX(-50%);
            background: #fff; color: #000;
            border: 4px solid #000;
            padding: 1rem;
            font-family: var(--font-pixel);
            font-size: 10px;
            z-index: 2000;
            display: none;
        }
        
        /* Loading skeleton for posts */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .loading { text-align: center; padding: 2rem; }
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            border-top: 4px solid var(--pipe-green);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .empty-state {
            background: #fff;
            color: #000;
            padding: 3rem;
            text-align: center;
            border: 4px solid #000;
        }
        .empty-state h3 { font-family: var(--font-pixel); font-size: 14px; margin-bottom: 1rem; }
        
        .char-count { text-align: right; font-size: 12px; color: #999; margin-top: -0.5rem; margin-bottom: 1rem; }
        
        .wallet-input-container { position: relative; }
        .toggle-visibility {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--coin-gold);
            border: 2px solid #000;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
        }
        
        .editor-section, .posts-section { display: none; }
        .editor-section.active, .posts-section.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <!-- HUD -->
        <div class="stats-hud">
            <div>ETERNAL BLISS<br>000000</div>
            <div>COINS: <span id="coinCount">00</span></div>
            <div>
                <button id="themeToggle" style="background:none; border:none; color:inherit; font:inherit; cursor:pointer;">
                    MODE: <span id="modeLabel">DAY</span>
                </button>
            </div>
            <div>WORLD: <span id="worldLabel">1-1</span></div>
        </div>

        <header class="header">
            <h1>ONCHAIN WORLD</h1>
            <p style="text-transform:uppercase; font-size:11px; color:rgba(255,255,255,0.7); letter-spacing: 2px;">Decentralized Blog on Algorand TestNet</p>
            <p style="margin-top: 10px; font-size: 10px;">
                <a href="https://lora.algokit.io/testnet/application/750081112" target="_blank" style="color: var(--coin-gold);">CONTRACT: 750081112</a>
            </p>
        </header>

        <!-- Wallet Terminal -->
        <section class="card card-special" id="walletSection">
            <h2>🔗 CONNECT WALLET</h2>
            <div id="walletSelection">
                <button id="btn-pera" class="btn">🟡 PERA WALLET</button>
                <button id="btn-defly" class="btn">🦅 DEFLY WALLET</button>
                <button id="btn-mnemonic" class="btn btn-coin">🔑 MNEMONIC</button>
            </div>

            <div id="walletInputSection" style="display: none;">
                <div class="wallet-input-container">
                    <textarea id="mnemonicInput" rows="3" placeholder="Enter your 25-word mnemonic phrase..." style="-webkit-text-security: disc;"></textarea>
                    <button id="btn-toggle-mnemonic" class="toggle-visibility">👁️ Show</button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button id="btn-connect-mnemonic" class="btn">CONNECT</button>
                    <button id="btn-back" class="btn btn-coin">← BACK</button>
                </div>
            </div>

            <div id="walletConnected" style="display: none;">
                <div style="font-family: var(--font-pixel); font-size: 11px; margin-bottom: 0.5rem; color:#000;">
                    ✅ CONNECTED <span id="walletType" style="font-size:9px; opacity:0.7;"></span>
                </div>
                <div style="font-family: monospace; font-size: 10px; color: #333; margin-bottom: 1rem; word-break: break-all;" id="connectedAddress"></div>
                <div style="font-family: var(--font-pixel); font-size: 11px; margin-bottom: 1.5rem; color:#000;">
                    BALANCE: <span id="algoBalance">0.00</span> ALGO
                </div>
                
                <div style="display: flex; flex-wrap: wrap;">
                    <button id="btn-show-editor" class="btn">✍️ NEW POST</button>
                    <button id="btn-load-posts" class="btn">📚 VIEW POSTS</button>
                    <button id="btn-disconnect" class="btn btn-coin">🚪 EXIT</button>
                </div>
            </div>
        </section>

        <div id="statusToast" class="status-toast"></div>

        <!-- Editor -->
        <section class="card editor-section" id="editorSection">
            <h2 id="editorTitle">✍️ NEW POST</h2>
            <div>
                <label style="font-family: var(--font-pixel); font-size: 10px;">TITLE</label>
                <input type="text" id="postTitle" placeholder="Enter title..." maxlength="200">
            </div>
            <div>
                <label style="font-family: var(--font-pixel); font-size: 10px;">CONTENT</label>
                <textarea id="postContent" rows="8" placeholder="Write your content..."></textarea>
                <div class="char-count"><span id="contentLength">0</span> / 3500</div>
            </div>
            <div style="display:flex; gap: 1rem;">
                <button id="btn-publish" class="btn">📤 PUBLISH</button>
                <button id="btn-cancel-editor" class="btn btn-coin">✖ CANCEL</button>
            </div>
        </section>

        <!-- Feed -->
        <section class="posts-section" id="postsSection">
            <div id="postsContainer"></div>
        </section>
    </div>

    <!-- Retro Floor -->
    <div class="ground-base"></div>

    <!-- Main Application Script -->
    <script type="module">
        // Buffer polyfill (must be loaded before wallet libraries)
        import { Buffer } from "https://esm.sh/buffer@6.0.3";
        window.Buffer = Buffer;
        window.global = window;
        window.process = { env: { NODE_ENV: 'production' } };

        // Import wallet libraries
        import { PeraWalletConnect } from "https://esm.sh/@perawallet/connect@1.3.4?bundle-deps";
        import { DeflyWalletConnect } from "https://esm.sh/@blockshake/defly-connect@1.1.6?bundle-deps";

        // Configuration
        const APP_ID = 750081112;
        const ALGOD_SERVER = 'https://testnet-api.algonode.cloud';
        const ALGOD_PORT = '';
        const ALGOD_TOKEN = '';

        // Global state
        let algodClient;
        let currentAccount = null;
        let currentAddress = null;
        let peraWallet = null;
        let deflyWallet = null;
        let walletType = null;
        const CHAIN_ID = 416002;

        // Editing state
        let editingPostId = null;
        let editingPost = null;

        // Full ABI Contract Definition
        const CONTRACT_ABI = {
            "name": "UniversalStateMachine",
            "methods": [
                {"name": "save_entity", "args": [{"type": "string", "name": "entity_id"}, {"type": "string", "name": "entity_data"}], "returns": {"type": "string"}},
                {"name": "load_entity", "args": [{"type": "string", "name": "entity_id"}], "returns": {"type": "string"}},
                {"name": "get_entity_owner", "args": [{"type": "string", "name": "entity_id"}], "returns": {"type": "address"}},
                {"name": "delete_entity", "args": [{"type": "string", "name": "entity_id"}], "returns": {"type": "void"}},
                {"name": "start_process", "args": [{"type": "string", "name": "process_id"}, {"type": "address", "name": "other_party"}, {"type": "string", "name": "initial_state"}, {"type": "uint64", "name": "timeout_rounds"}], "returns": {"type": "string"}},
                {"name": "update_process", "args": [{"type": "string", "name": "process_id"}, {"type": "string", "name": "new_state"}], "returns": {"type": "string"}},
                {"name": "resign_process", "args": [{"type": "string", "name": "process_id"}], "returns": {"type": "void"}},
                {"name": "load_process", "args": [{"type": "string", "name": "process_id"}], "returns": {"type": "string"}},
                {"name": "delete_process", "args": [{"type": "string", "name": "process_id"}], "returns": {"type": "void"}},
                {"name": "get_process_info", "args": [{"type": "string", "name": "process_id"}], "returns": {"type": "(address,address,uint64,bool,uint64)"}},
                {"name": "pause", "args": [], "returns": {"type": "string"}},
                {"name": "unpause", "args": [], "returns": {"type": "string"}},
                {"name": "set_admin", "args": [{"type": "address", "name": "new_admin"}], "returns": {"type": "string"}},
                {"name": "withdraw_excess", "args": [{"type": "uint64", "name": "amount"}], "returns": {"type": "string"}},
                {"name": "get_admin", "args": [], "returns": {"type": "address"}},
                {"name": "is_paused", "args": [], "returns": {"type": "bool"}}
            ]
        };

        // Helper: Create box key for contract v3.2
        function createBlogBoxKey(postId) {
            const encoder = new TextEncoder();
            const prefix = encoder.encode('e:');
            const idBytes = encoder.encode(postId);
            const boxKey = new Uint8Array(prefix.length + idBytes.length);
            boxKey.set(prefix, 0);
            boxKey.set(idBytes, prefix.length);
            return boxKey;
        }

        // Initialize Algorand client
        function initAlgod() {
            if (typeof algosdk === 'undefined') {
                console.error('algosdk not loaded!');
                showToast('ERROR: SDK NOT LOADED');
                return false;
            }
            algodClient = new algosdk.Algodv2(ALGOD_TOKEN, ALGOD_SERVER, ALGOD_PORT);
            console.log('Algorand client initialized');
            return true;
        }

        // Initialize wallet instances
        function initWallets() {
            try {
                peraWallet = new PeraWalletConnect({ chainId: CHAIN_ID });
                deflyWallet = new DeflyWalletConnect({ chainId: CHAIN_ID });

                peraWallet.connector?.on('disconnect', () => {
                    if (walletType === 'pera') handleDisconnect();
                });

                deflyWallet.connector?.on('disconnect', () => {
                    if (walletType === 'defly') handleDisconnect();
                });

                console.log('Wallets initialized');
                return true;
            } catch (error) {
                console.error('Failed to initialize wallets:', error);
                showToast('WALLET INIT ERROR');
                return false;
            }
        }

        // Check for existing sessions
        async function checkSessions() {
            try {
                const peraAccounts = await peraWallet.reconnectSession();
                if (peraAccounts.length) {
                    handleConnectSuccess('pera', peraAccounts[0]);
                    return;
                }
            } catch(e) {}

            try {
                const deflyAccounts = await deflyWallet.reconnectSession();
                if (deflyAccounts.length) {
                    handleConnectSuccess('defly', deflyAccounts[0]);
                    return;
                }
            } catch(e) {}
        }

        // UI Functions
        function showMnemonicInput() {
            document.getElementById('walletSelection').style.display = 'none';
            document.getElementById('walletInputSection').style.display = 'block';
        }

        function backToWalletSelection() {
            document.getElementById('walletSelection').style.display = 'block';
            document.getElementById('walletInputSection').style.display = 'none';
            document.getElementById('mnemonicInput').value = '';
        }

        function toggleMnemonicVisibility() {
            const input = document.getElementById('mnemonicInput');
            const btn = document.getElementById('btn-toggle-mnemonic');
            if (input.style.webkitTextSecurity === 'disc') {
                input.style.webkitTextSecurity = 'none';
                btn.textContent = '🙈 Hide';
            } else {
                input.style.webkitTextSecurity = 'disc';
                btn.textContent = '👁️ Show';
            }
        }

        // Connect with Pera Wallet
        async function connectPeraWallet() {
            try {
                showToast('CONNECTING PERA...');
                const accounts = await peraWallet.connect();
                if (accounts.length > 0) {
                    handleConnectSuccess('pera', accounts[0]);
                } else {
                    showToast('NO ACCOUNTS');
                }
            } catch (error) {
                if (error?.data?.type !== "CONNECT_MODAL_CLOSED" && error?.message !== "Connect modal is closed by user") {
                    showToast('PERA ERROR: ' + (error.message || 'Unknown'));
                }
            }
        }

        // Connect with Defly Wallet
        async function connectDeflyWallet() {
            try {
                showToast('CONNECTING DEFLY...');
                const accounts = await deflyWallet.connect();
                if (accounts.length > 0) {
                    handleConnectSuccess('defly', accounts[0]);
                } else {
                    showToast('NO ACCOUNTS');
                }
            } catch (error) {
                if (error?.data?.type !== "CONNECT_MODAL_CLOSED" && error?.message !== "Connect modal is closed by user") {
                    showToast('DEFLY ERROR: ' + (error.message || 'Unknown'));
                }
            }
        }

        // Connect with Mnemonic
        async function connectWithMnemonic() {
            try {
                const mnemonic = document.getElementById('mnemonicInput').value.trim();
                if (!mnemonic) {
                    showToast('ENTER MNEMONIC');
                    return;
                }
                currentAccount = algosdk.mnemonicToSecretKey(mnemonic);
                handleConnectSuccess('mnemonic', currentAccount.addr);
            } catch (error) {
                showToast('INVALID MNEMONIC');
            }
        }

        // Handle successful connection
        async function handleConnectSuccess(type, address) {
            walletType = type;
            currentAddress = address;

            if (type !== 'mnemonic') {
                currentAccount = { addr: address };
            }

            try {
                const accountInfo = await algodClient.accountInformation(address).do();
                const balance = (accountInfo.amount / 1000000).toFixed(2);
                document.getElementById('algoBalance').textContent = balance;
                document.getElementById('coinCount').textContent = Math.floor(balance).toString().padStart(2, '0');
            } catch (e) {
                document.getElementById('algoBalance').textContent = '0.00';
            }

            document.getElementById('walletSelection').style.display = 'none';
            document.getElementById('walletInputSection').style.display = 'none';
            document.getElementById('walletConnected').style.display = 'block';
            document.getElementById('connectedAddress').textContent = address;

            const walletNames = { pera: 'Pera', defly: 'Defly', mnemonic: 'Mnemonic' };
            document.getElementById('walletType').textContent = `(${walletNames[type]})`;

            showToast('CONNECTED: ' + walletNames[type]);
        }

        // Disconnect wallet
        function handleDisconnect() {
            if (walletType === 'pera' && peraWallet) peraWallet.disconnect();
            if (walletType === 'defly' && deflyWallet) deflyWallet.disconnect();

            walletType = null;
            currentAccount = null;
            currentAddress = null;

            document.getElementById('walletConnected').style.display = 'none';
            document.getElementById('walletSelection').style.display = 'block';
            document.getElementById('editorSection').classList.remove('active');
            document.getElementById('postsSection').classList.remove('active');
            document.getElementById('mnemonicInput').value = '';

            showToast('DISCONNECTED');
        }

        // Show editor
        function showEditor(post = null) {
            document.getElementById('editorSection').classList.add('active');
            document.getElementById('postsSection').classList.remove('active');

            if (post) {
                editingPostId = post.entityId;
                editingPost = post;
                document.getElementById('editorTitle').textContent = '✏️ EDIT POST';
                document.getElementById('postTitle').value = post.title;
                document.getElementById('postContent').value = post.content;
                document.getElementById('contentLength').textContent = post.content.length;
            } else {
                editingPostId = null;
                editingPost = null;
                document.getElementById('editorTitle').textContent = '✍️ NEW POST';
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                document.getElementById('contentLength').textContent = '0';
            }
        }

        // Edit a post
        function editPost(entityId) {
            loadPostForEdit(entityId);
        }

        // Load a specific post for editing
        async function loadPostForEdit(entityId) {
            try {
                showToast('LOADING POST...');

                const boxKey = createBlogBoxKey(entityId);
                const boxData = await algodClient.getApplicationBoxByName(APP_ID, boxKey).do();
                const boxValue = boxData.value;

                const dataBytes = boxValue.slice(32);
                const decoder = new TextDecoder();
                const jsonData = decoder.decode(dataBytes);
                const post = JSON.parse(jsonData);
                post.entityId = entityId;

                showEditor(post);
            } catch (error) {
                console.error('Error loading post for edit:', error);
                showToast('LOAD FAILED');
            }
        }

        // Cancel editor
        function cancelEditor() {
            document.getElementById('editorSection').classList.remove('active');
            editingPostId = null;
            editingPost = null;
        }

        // Publish post to blockchain
        async function publishPost() {
            if (!currentAccount) {
                showToast('CONNECT WALLET FIRST');
                return;
            }

            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!title || !content) {
                showToast('FILL ALL FIELDS');
                return;
            }

            const isEditing = editingPostId !== null;

            try {
                showToast(isEditing ? 'UPDATING...' : 'PUBLISHING...');

                const postData = {
                    title: title,
                    content: content,
                    author: currentAccount.addr,
                    timestamp: isEditing ? editingPost.timestamp : Date.now()
                };

                if (isEditing) {
                    postData.modifiedAt = Date.now();
                }

                let postId;
                if (isEditing) {
                    postId = editingPostId;
                } else {
                    const addr = currentAccount.addr;
                    const shortAddr = addr.slice(0, 8) + addr.slice(-8);
                    postId = `blog-${Date.now()}-${shortAddr}`;
                }

                const params = await algodClient.getTransactionParams().do();
                const encoder = new TextEncoder();
                const entityIdBytes = encoder.encode(postId);
                const entityDataBytes = encoder.encode(JSON.stringify(postData));

                const keyLen = entityIdBytes.length + 2;
                const dataLen = entityDataBytes.length + 2;
                const totalBytes = 2 + keyLen + 32 + dataLen;
                const mbrAmount = 2500 + (400 * totalBytes);

                const boxKey = createBlogBoxKey(postId);

                if (walletType === 'mnemonic') {
                    const atc = new algosdk.AtomicTransactionComposer();

                    const mbrTxn = algosdk.makePaymentTxnWithSuggestedParamsFromObject({
                        from: currentAccount.addr,
                        to: algosdk.getApplicationAddress(APP_ID),
                        amount: mbrAmount,
                        suggestedParams: params
                    });

                    const contract = new algosdk.ABIContract(CONTRACT_ABI);
                    const method = contract.getMethodByName('save_entity');
                    const signer = algosdk.makeBasicAccountTransactionSigner(currentAccount);

                    atc.addTransaction({ txn: mbrTxn, signer: signer });
                    atc.addMethodCall({
                        appID: APP_ID,
                        method: method,
                        methodArgs: [postId, JSON.stringify(postData)],
                        sender: currentAccount.addr,
                        suggestedParams: params,
                        signer: signer,
                        boxes: [{appIndex: APP_ID, name: boxKey}]
                    });

                    await atc.execute(algodClient, 3);
                } else {
                    const contract = new algosdk.ABIContract(CONTRACT_ABI);
                    const method = contract.getMethodByName('save_entity');
                    const methodSelector = method.getSelector();
                    const enc = new TextEncoder();

                    const encodeARC4String = (str) => {
                        const bytes = enc.encode(str);
                        const len = bytes.length;
                        const result = new Uint8Array(2 + len);
                        result[0] = (len >> 8) & 0xFF;
                        result[1] = len & 0xFF;
                        result.set(bytes, 2);
                        return result;
                    };

                    const arg1 = encodeARC4String(postId);
                    const arg2 = encodeARC4String(JSON.stringify(postData));

                    const mbrTxn = algosdk.makePaymentTxnWithSuggestedParamsFromObject({
                        from: currentAddress,
                        to: algosdk.getApplicationAddress(APP_ID),
                        amount: mbrAmount,
                        suggestedParams: params
                    });

                    const appCallTxn = algosdk.makeApplicationNoOpTxnFromObject({
                        from: currentAddress,
                        appIndex: APP_ID,
                        appArgs: [methodSelector, arg1, arg2],
                        foreignAssets: [],
                        accounts: [],
                        foreignApps: [],
                        boxes: [{appIndex: APP_ID, name: boxKey}],
                        suggestedParams: params
                    });

                    const txnGroup = [mbrTxn, appCallTxn];
                    algosdk.assignGroupID(txnGroup);

                    const txnsToSign = txnGroup.map(txn => ({ txn }));

                    let signedTxns;
                    if (walletType === 'pera') {
                        signedTxns = await peraWallet.signTransaction([txnsToSign]);
                    } else {
                        signedTxns = await deflyWallet.signTransaction([txnsToSign]);
                    }

                    const flatSignedTxns = signedTxns.flat().filter(txn => txn != null);
                    const { txId } = await algodClient.sendRawTransaction(flatSignedTxns).do();
                    await algosdk.waitForConfirmation(algodClient, txId, 3);
                }

                showToast(isEditing ? 'POST UPDATED!' : 'POST PUBLISHED!');

                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                document.getElementById('editorSection').classList.remove('active');
                editingPostId = null;
                editingPost = null;

                setTimeout(() => loadAllPosts(), 2000);

            } catch (error) {
                console.error('Publish error:', error);
                showToast('PUBLISH FAILED: ' + error.message);
            }
        }

        // Load all posts from blockchain
        async function loadAllPosts() {
            if (!currentAccount) {
                showToast('CONNECT WALLET FIRST');
                return;
            }

            try {
                showToast('LOADING POSTS...');

                document.getElementById('editorSection').classList.remove('active');
                document.getElementById('postsSection').classList.add('active');

                const container = document.getElementById('postsContainer');
                container.innerHTML = '<div class="loading"><div class="spinner"></div><p style="font-family: var(--font-pixel); font-size: 10px;">LOADING FROM CHAIN...</p></div>';

                const boxes = await algodClient.getApplicationBoxes(APP_ID).do();
                const blogPosts = [];
                const decoder = new TextDecoder();

                for (const box of boxes.boxes) {
                    const rawName = box.name;

                    if (rawName[0] === 0x65 && rawName[1] === 0x3a) {
                        const entityIdBytes = rawName.slice(2);
                        const entityId = decoder.decode(entityIdBytes);

                        if (entityId.startsWith('blog-')) {
                            try {
                                const boxData = await algodClient.getApplicationBoxByName(APP_ID, rawName).do();
                                const boxValue = boxData.value;
                                const dataBytes = boxValue.slice(32);
                                const jsonData = decoder.decode(dataBytes);
                                const post = JSON.parse(jsonData);
                                post.id = `e:${entityId}`;
                                post.entityId = entityId;
                                blogPosts.push(post);
                            } catch (error) {
                                console.error('Error loading box:', entityId, error);
                            }
                        }
                    }
                }

                blogPosts.sort((a, b) => b.timestamp - a.timestamp);

                if (blogPosts.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>NO POSTS YET</h3>
                            <p>Be the first to write on the blockchain!</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = blogPosts.map(post => createPostCard(post)).join('');
                }

                showToast('LOADED ' + blogPosts.length + ' POST(S)');

            } catch (error) {
                console.error('Load error:', error);
                showToast('LOAD FAILED');
                document.getElementById('postsContainer').innerHTML = `
                    <div class="empty-state">
                        <h3>ERROR LOADING</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Create post card HTML
        function createPostCard(post) {
            const date = new Date(post.timestamp);
            const isOwner = currentAccount && post.author === currentAccount.addr;

            let modifiedHtml = '';
            if (post.modifiedAt) {
                const modifiedDate = new Date(post.modifiedAt);
                modifiedHtml = `<div class="post-modified">✏️ Modified: ${modifiedDate.toLocaleDateString()} ${modifiedDate.toLocaleTimeString()}</div>`;
            }

            return `
                <div class="card post-card">
                    <div class="post-meta">
                        BY: ${post.author.substring(0, 10)}...${post.author.substring(post.author.length - 8)}
                        &nbsp;•&nbsp;
                        ${date.toLocaleDateString()} ${date.toLocaleTimeString()}
                    </div>
                    ${modifiedHtml}
                    <h2>${escapeHtml(post.title)}</h2>
                    <div class="post-content">${escapeHtml(post.content)}</div>
                    ${isOwner ? `
                        <div class="post-actions">
                            <button class="btn edit-post-btn" data-entity-id="${post.entityId}">✏️ EDIT</button>
                            <button class="btn btn-danger delete-post-btn" data-entity-id="${post.entityId}">🗑️ DELETE</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Delete post
        async function deletePost(entityId) {
            if (!confirm('Delete this post from the blockchain?')) {
                return;
            }

            try {
                showToast('DELETING...');

                const params = await algodClient.getTransactionParams().do();
                const contract = new algosdk.ABIContract(CONTRACT_ABI);
                const method = contract.getMethodByName('delete_entity');
                const boxKey = createBlogBoxKey(entityId);

                if (walletType === 'mnemonic') {
                    const atc = new algosdk.AtomicTransactionComposer();
                    const signer = algosdk.makeBasicAccountTransactionSigner(currentAccount);

                    const deleteParams = { ...params };
                    deleteParams.flatFee = true;
                    deleteParams.fee = 2 * algosdk.ALGORAND_MIN_TX_FEE;

                    atc.addMethodCall({
                        appID: APP_ID,
                        method: method,
                        methodArgs: [entityId],
                        sender: currentAccount.addr,
                        suggestedParams: deleteParams,
                        signer: signer,
                        boxes: [{appIndex: APP_ID, name: boxKey}]
                    });

                    await atc.execute(algodClient, 3);
                } else {
                    const methodSelector = method.getSelector();
                    const enc = new TextEncoder();

                    const encodeARC4String = (str) => {
                        const bytes = enc.encode(str);
                        const len = bytes.length;
                        const result = new Uint8Array(2 + len);
                        result[0] = (len >> 8) & 0xFF;
                        result[1] = len & 0xFF;
                        result.set(bytes, 2);
                        return result;
                    };

                    const arg1 = encodeARC4String(entityId);

                    const deleteParams = { ...params };
                    deleteParams.flatFee = true;
                    deleteParams.fee = 2 * algosdk.ALGORAND_MIN_TX_FEE;

                    const txn = algosdk.makeApplicationNoOpTxnFromObject({
                        from: currentAddress,
                        appIndex: APP_ID,
                        appArgs: [methodSelector, arg1],
                        boxes: [{appIndex: APP_ID, name: boxKey}],
                        suggestedParams: deleteParams
                    });

                    const txnToSign = [{ txn }];

                    let signedTxns;
                    if (walletType === 'pera') {
                        signedTxns = await peraWallet.signTransaction([txnToSign]);
                    } else {
                        signedTxns = await deflyWallet.signTransaction([txnToSign]);
                    }

                    const flatSignedTxns = signedTxns.flat().filter(txn => txn != null);
                    const { txId } = await algodClient.sendRawTransaction(flatSignedTxns).do();
                    await algosdk.waitForConfirmation(algodClient, txId, 3);
                }

                showToast('POST DELETED!');
                setTimeout(() => loadAllPosts(), 2000);

            } catch (error) {
                console.error('Delete error:', error);
                showToast('DELETE FAILED: ' + error.message);
            }
        }

        // Show toast message
        function showToast(message) {
            const statusEl = document.getElementById('statusToast');
            statusEl.textContent = '! ' + message + ' !';
            statusEl.style.display = 'block';
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 4000);
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Theme toggle
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('modeLabel').textContent = newTheme === 'dark' ? 'NIGHT' : 'DAY';
            document.getElementById('worldLabel').textContent = newTheme === 'dark' ? '1-4' : '1-1';
            localStorage.setItem('blogTheme', newTheme);
        }

        // Initialize theme
        function initTheme() {
            const savedTheme = localStorage.getItem('blogTheme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('modeLabel').textContent = 'NIGHT';
                document.getElementById('worldLabel').textContent = '1-4';
            }
        }

        // Character count
        document.getElementById('postContent').addEventListener('input', (e) => {
            const length = e.target.value.length;
            document.getElementById('contentLength').textContent = length;
            if (length > 3500) {
                e.target.value = e.target.value.substring(0, 3500);
                document.getElementById('contentLength').textContent = '3500';
            }
        });

        // Initialize
        initTheme();
        const algodOk = initAlgod();
        const walletsOk = initWallets();

        if (algodOk && walletsOk) {
            console.log('✅ Initialization complete');
            checkSessions();
        }

        // Event listeners
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        document.getElementById('btn-pera').addEventListener('click', connectPeraWallet);
        document.getElementById('btn-defly').addEventListener('click', connectDeflyWallet);
        document.getElementById('btn-mnemonic').addEventListener('click', showMnemonicInput);
        document.getElementById('btn-toggle-mnemonic').addEventListener('click', toggleMnemonicVisibility);
        document.getElementById('btn-connect-mnemonic').addEventListener('click', connectWithMnemonic);
        document.getElementById('btn-back').addEventListener('click', backToWalletSelection);
        document.getElementById('btn-show-editor').addEventListener('click', () => showEditor());
        document.getElementById('btn-load-posts').addEventListener('click', loadAllPosts);
        document.getElementById('btn-disconnect').addEventListener('click', handleDisconnect);
        document.getElementById('btn-publish').addEventListener('click', publishPost);
        document.getElementById('btn-cancel-editor').addEventListener('click', cancelEditor);

        // Event delegation for edit and delete buttons
        document.getElementById('postsContainer').addEventListener('click', (e) => {
            if (e.target.classList.contains('edit-post-btn')) {
                const entityId = e.target.getAttribute('data-entity-id');
                editPost(entityId);
            }
            if (e.target.classList.contains('delete-post-btn')) {
                const entityId = e.target.getAttribute('data-entity-id');
                deletePost(entityId);
            }
        });
    </script>
</body>
</html>
